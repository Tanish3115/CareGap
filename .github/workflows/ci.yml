name: Application checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caregap
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: caregap_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U caregap" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock.txt
      - run: python -m pytest -q
      - name: PostgreSQL migrations and API regression
        run: python ../scripts/check_postgres.py
        env:
          CAREGAP_POSTGRES_URL: postgresql+psycopg://caregap:synthetic_ci_only@localhost:5432/postgres
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install --require-hashes -r backend/requirements.lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
