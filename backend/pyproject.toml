[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Entry points must set import paths/environment before importing application modules.
"**/scripts/*.py" = ["E402"]
"**/research/*.py" = ["E402"]
"**/tests/conftest.py" = ["E402"]
